services:
  web:
    build: .
    container_name: tutor_ia_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8089:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: tutor_ia_db
    environment:
      POSTGRES_DB: tutor_ia_db
      POSTGRES_USER: tutor_user
      POSTGRES_PASSWORD: tutor_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: