{% extends "base.html" %}

{% block title %}Datos academicos | Tutor IA Anatom&iacute;a VARK{% endblock %}

{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Obtencion de datos previa</p>
        <h1>Datos academicos</h1>
        <p>Esta informacion ayuda a construir una ruta realista antes de generar actividades.</p>
    </div>
</section>

<form method="post" class="form-panel wide-form">
    {% csrf_token %}
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label" for="materia">Materia</label>
            <input class="form-control" id="materia" name="materia" value="Anatomia I" required>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="tema">Tema actual</label>
            <input class="form-control" id="tema" name="tema" placeholder="Ej. Sistema oseo" required>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="fecha_inicio">Fecha de inicio</label>
            <input class="form-control" id="fecha_inicio" type="date" name="fecha_inicio" required>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="fecha_examen">Fecha de examen</label>
            <input class="form-control" id="fecha_examen" type="date" name="fecha_examen" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="horas">Horas disponibles por dia</label>
            <input class="form-control" id="horas" type="number" min="1" max="12" name="horas" value="2" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="tipo">Tipo de examen</label>
            <select class="form-select" id="tipo" name="tipo" required>
                {% for tipo in tipos_examen %}
                    <option>{{ tipo }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="nivel">Nivel de dificultad</label>
            <select class="form-select" id="nivel" name="nivel" required>
                {% for nivel in niveles %}
                    <option>{{ nivel }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="form-actions">
        <button class="btn btn-primary btn-lg icon-btn" type="submit">
            <i data-lucide="save"></i>
            <span>Guardar datos</span>
        </button>
    </div>
</form>
{% endblock %}
